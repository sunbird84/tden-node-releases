name: Build TDEN node candidate

on:
  workflow_dispatch:
    inputs:
      chain_ref:
        description: Exact tden-chain commit or tag
        required: true
        type: string
      gateway_ref:
        description: Exact tden-gateway commit or tag
        required: true
        type: string
      deploy_ref:
        description: Exact tden-deploy commit or tag
        required: true
        type: string
      version:
        description: Semantic package version
        required: true
        default: 0.12.0
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: node-candidate-${{ inputs.chain_ref }}-${{ inputs.gateway_ref }}-${{ inputs.deploy_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out Chain source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-chain
          ref: ${{ inputs.chain_ref }}
          path: source/tden-chain
          ssh-key: ${{ secrets.TDEN_CHAIN_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out Gateway source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-gateway
          ref: ${{ inputs.gateway_ref }}
          path: source/tden-gateway
          ssh-key: ${{ secrets.TDEN_GATEWAY_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out deployment source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-deploy
          ref: ${{ inputs.deploy_ref }}
          path: source/deploy
          ssh-key: ${{ secrets.TDEN_DEPLOY_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false

      - name: Verify source revisions are exact and clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'source/tden-chain' = '${{ inputs.chain_ref }}'
            'source/tden-gateway' = '${{ inputs.gateway_ref }}'
            'source/deploy' = '${{ inputs.deploy_ref }}'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $head = (git -C $entry.Key rev-parse HEAD).Trim()
            $resolved = (git -C $entry.Key rev-parse "$($entry.Value)^{commit}").Trim()
            if ($head -cne $resolved) { throw "source revision mismatch: $($entry.Key)" }
            if (git -C $entry.Key status --porcelain=v1) { throw "dirty source checkout: $($entry.Key)" }
          }

      - name: Verify fixed release trust policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          policy = json.loads(pathlib.Path('release-policy.json').read_text(encoding='utf-8'))
          if set(policy) != {'protocol', 'bootstrap_trust_template_sha256', 'tuf_root_sha256'}:
              raise SystemExit('release policy fields are invalid')
          if policy['protocol'] != 'tden:node-release-policy:v1':
              raise SystemExit('release policy protocol is invalid')
          files = {
              'bootstrap_trust_template_sha256': pathlib.Path('source/deploy/node-installer/trust/bootstrap-trust-template.production.json'),
              'tuf_root_sha256': pathlib.Path('source/deploy/node-installer/trust/tuf-root.production.json'),
          }
          for key, path in files.items():
              value = policy.get(key, '')
              if not re.fullmatch(r'[0-9a-f]{64}', value):
                  raise SystemExit(f'{key} is invalid')
              if hashlib.sha256(path.read_bytes()).hexdigest() != value:
                  raise SystemExit(f'{path} conflicts with release-policy.json')
          PY

      - name: Stage exact shared protocol test vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_shared_spec_fixtures.py

      - name: Fetch exact pinned Kubo upstream archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          test ! -e inputs/kubo_v0.42.0_linux-amd64.tar.gz
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 \
            --output inputs/kubo_v0.42.0_linux-amd64.tar.gz \
            https://github.com/ipfs/kubo/releases/download/v0.42.0/kubo_v0.42.0_linux-amd64.tar.gz
          printf '%s  %s\n' '054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156' inputs/kubo_v0.42.0_linux-amd64.tar.gz | sha512sum --check --strict -
          test "$(stat -c %s inputs/kubo_v0.42.0_linux-amd64.tar.gz)" = 54571642

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          (cd source/tden-chain && go test ./...)
          (cd source/tden-gateway && go test ./...)
          go run scripts/check-public-policy-contract.go -- source/tden-gateway/internal/nodesecurity/policy.go source/deploy/node-installer/install.sh
          (cd source/tden-gateway && go test -c ./cmd/gateway -o /tmp/tden-gateway-receipts.test)
          sudo env TDEN_TEST_RECEIPT_PERMISSIONS=1 /tmp/tden-gateway-receipts.test -test.run '^TestReleaseReceipt' -test.v
          (cd source/tden-gateway && go test -c ./cmd/node-service-config -o /tmp/tden-node-service-config.test)
          sudo /tmp/tden-node-service-config.test -test.run '^(TestReconcilePlanConsumesExactAuthorizationOnce|TestHandoffPermissionRetryDoesNotAdvanceGeneration)$' -test.v
          (cd source/tden-gateway && go test -c ./cmd/node-public-handoff -o /tmp/tden-node-public-handoff.test)
          sudo /tmp/tden-node-public-handoff.test -test.run '^TestServiceMigrationHelperRequiresExactImmutablePolicyBinding$' -test.v
          bash -n source/deploy/node-installer/*.sh
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 source/deploy/node-installer/test-gateway-release-catalog.py
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 -B source/deploy/node-installer/test-release-receipt-permissions.py -v
          sudo bash source/deploy/node-installer/test-public-supervisor-storage-access.sh
          python3 source/deploy/node-installer/test-public-endpoint.py AddressTests -v
          python3 -B source/deploy/node-installer/test-resolve-public-ca-route.py -v
          python3 -B source/deploy/node-installer/test-public-supervisor-preflight.py -v
          python3 -B source/deploy/node-installer/test-node-runtime-files.py -v
          python3 -B source/deploy/node-installer/test-install-quiescence.py -v
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 -B source/deploy/node-installer/test-node-runtime-files.py RuntimeScanSystemdTests -v
          sudo python3 source/deploy/node-installer/test-caddy-handoff.py -v
          sudo python3 source/deploy/node-installer/test-lifecycle-history.py -v
          pwsh -NoProfile -File source/deploy/node-installer/test-install-state-root.ps1
          pwsh -NoProfile -File source/deploy/node-installer/test-release-isolation.ps1
          pwsh -NoProfile -File source/deploy/node-installer/test-node-runtime-upgrade-contract.ps1

      - name: Bind original module cache input path
        shell: bash
        run: |
          set -euo pipefail
          original_base=/root/TDEN2_LOCAL_NODE_20261112
          original_cache="$original_base/cache/go-mod"
          source_cache="$(go env GOMODCACHE)"
          state="$RUNNER_TEMP/tden-original-module-path-state"
          test "$source_cache" = /home/runner/go/pkg/mod
          test -d "$source_cache"
          test ! -e "$state"
          test ! -e "$RUNNER_TEMP/tden-original-build-cache"
          if sudo test -e "$original_base" || sudo test -L "$original_base"; then
            echo 'Original module input path already exists; refusing to replace it' >&2
            exit 1
          fi
          umask 077
          mkdir "$state" "$RUNNER_TEMP/tden-original-build-cache"
          test ! -L /root
          test "$(stat -c %u /root)" = 0
          sudo python3 - "$state/root-permissions.json" <<'PY'
          import base64, errno, json, os, stat, sys
          try:
              acl = os.getxattr('/root', 'system.posix_acl_access')
          except OSError as error:
              if error.errno not in (errno.ENODATA, errno.ENOTSUP): raise
              acl = None
          value = {'mode': stat.S_IMODE(os.stat('/root').st_mode), 'acl': None if acl is None else base64.b64encode(acl).decode('ascii')}
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as stream:
              json.dump(value, stream, sort_keys=True)
              stream.flush()
              os.fsync(stream.fileno())
          PY
          printf '%s\n' "$source_cache" > "$state/source-cache"
          sudo mkdir -m 0755 "$original_base"
          touch "$state/base-created"
          sudo mkdir -m 0755 "$original_base/cache"
          sudo ln -s "$source_cache" "$original_cache"
          touch "$state/alias-created"
          sudo chmod go+x /root
          test "$(readlink "$original_cache")" = "$source_cache"
          printf '%s  %s\n' '444cf1e9d9a0462634bd718cd26d5926a5a70a7b0c76610611e7f2658335b581' "$original_cache/github.com/consensys/gnark-crypto@v0.20.1/field/asm/element_4w/element_4w_amd64.s" | sha256sum --check --strict -

      - name: Build deterministic Linux package
        shell: pwsh
        env:
          GOWORK: 'off'
          GOMAXPROCS: '4'
          GOFLAGS: '-mod=readonly -p=4'
          GOMODCACHE: '/root/TDEN2_LOCAL_NODE_20261112/cache/go-mod'
          GOCACHE: '${{ runner.temp }}/tden-original-build-cache'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path output/package -Force | Out-Null
          & source/deploy/node-installer/build-node-package.ps1 `
            -OutputDirectory output/package `
            -BootstrapTrustTemplate source/deploy/node-installer/trust/bootstrap-trust-template.production.json `
            -TufRoot source/deploy/node-installer/trust/tuf-root.production.json `
            -ReleaseTrustTemplate source/deploy/node-installer/trust/release-trust-template.production.json `
            -ApprovalAttestationAllowlist source/deploy/node-installer/trust/approval-attestations.fail-closed.txt `
            -LifecycleGatewayTrust source/deploy/node-installer/trust/lifecycle-gateway-trust.production.json `
            -KuboArchive inputs/kubo_v0.42.0_linux-amd64.tar.gz `
            -Profile public `
            -Architecture amd64 `
            -Version '${{ inputs.version }}'

      - name: Record exact build measurements
        shell: bash
        env:
          GOMODCACHE: '/root/TDEN2_LOCAL_NODE_20261112/cache/go-mod'
          GOCACHE: '${{ runner.temp }}/tden-original-build-cache'
        run: |
          set -euo pipefail
          go env GOMODCACHE GOCACHE
          go version
          sha256sum "$(command -v go)"
          python3 - <<'PY'
          import json, sys, zlib
          print(json.dumps({'python': sys.version, 'zlib_compile': zlib.ZLIB_VERSION, 'zlib_runtime': zlib.ZLIB_RUNTIME_VERSION}, sort_keys=True))
          PY
          go version -m -json output/package/tden-node-runtime-upgrade
          cat output/package/package.sha256
          (cd source/tden-chain && go mod verify)
          (cd source/tden-gateway && go mod verify)

      - name: Archive and describe candidate
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output/release
          SOURCE_DATE_EPOCH=0 bash source/deploy/node-installer/archive-node-package.sh \
            output/package output/release/tden-node-linux-amd64.tar.gz
          (cd output/release && sha256sum tden-node-linux-amd64.tar.gz > tden-node-linux-amd64.tar.gz.sha256)
          python3 scripts/candidate_metadata.py create

      - name: Verify original archive byte identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'ea9c0c35d329bf96ac832b3478b20d56184fbae4f47eb31bcacb63f2d3f8a2e8' output/package/tden-node-runtime-upgrade | sha256sum --check --strict -
          printf '%s  %s\n' '8273d096efc6931ad39a147179240d9ba028972c1f69c47f49e17ca023a9a285' output/release/tden-node-linux-amd64.tar.gz | sha256sum --check --strict -
          test "$(stat -c %s output/release/tden-node-linux-amd64.tar.gz)" = 407233839

      - name: Verify archived bootstrap and original metadata
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/package_bootstrap_preflight.py \
            --archive output/release/tden-node-linux-amd64.tar.gz \
            --version "$CANDIDATE_VERSION" \
            --materials scripts/fixtures/bootstrap-preflight

      - name: Restore temporary module path access
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/tden-original-module-path-state"
          original_base=/root/TDEN2_LOCAL_NODE_20261112
          original_cache="$original_base/cache/go-mod"
          if test -f "$state/root-permissions.json"; then
            sudo python3 - "$state/root-permissions.json" <<'PY'
          import base64, errno, json, os, stat, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              value = json.load(stream)
          mode = value['mode']
          if type(mode) is not int or not 0 <= mode <= 0o7777: raise ValueError('invalid captured mode')
          original_acl = None if value['acl'] is None else base64.b64decode(value['acl'], validate=True)
          os.chmod('/root', mode)
          if original_acl is not None:
              os.setxattr('/root', 'system.posix_acl_access', original_acl)
          else:
              try:
                  os.removexattr('/root', 'system.posix_acl_access')
              except OSError as error:
                  if error.errno not in (errno.ENODATA, errno.ENOTSUP): raise
          try:
              actual_acl = os.getxattr('/root', 'system.posix_acl_access')
          except OSError as error:
              if error.errno not in (errno.ENODATA, errno.ENOTSUP): raise
              actual_acl = None
          if stat.S_IMODE(os.stat('/root').st_mode) != mode or actual_acl != original_acl:
              raise ValueError('original mode/ACL restoration mismatch')
          print('PASS: original root mode and ACL restored and read back')
          PY
          fi
          if test -f "$state/alias-created"; then
            source_cache="$(cat "$state/source-cache")"
            test "$(sudo readlink "$original_cache")" = "$source_cache"
            sudo rm -- "$original_cache"
          fi
          if test -f "$state/base-created"; then
            if sudo test -d "$original_base/cache"; then sudo rmdir "$original_base/cache"; fi
            sudo rmdir "$original_base"
          fi

      - name: Upload candidate without publishing a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tden-node-candidate-${{ github.run_id }}
          path: output/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attest candidate archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release/tden-node-linux-amd64.tar.gz

      - name: Attest candidate build description
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release/candidate-build.json
