name: Bounded gateway rejection diagnostic

on:
  workflow_dispatch:
    inputs:
      gateway_ref:
        description: Exact private diagnostic commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'sunbird84/tden-node-releases' && github.ref == 'refs/heads/codex/gateway-diagnostic-20261108-260'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out exact private Chain dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: sunbird84/tden-chain
          ref: 4e5b548a97b2ddc72e8e7fa2211604be4a56a2b6
          path: source/tden-chain
          ssh-key: ${{ secrets.TDEN_CHAIN_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out exact private Gateway diagnostic
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: sunbird84/tden-gateway
          ref: ${{ inputs.gateway_ref }}
          path: source/tden-gateway
          ssh-key: ${{ secrets.TDEN_GATEWAY_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Guard exact clean inputs
        env:
          EXPECTED_GATEWAY: ${{ inputs.gateway_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_GATEWAY" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C source/tden-chain rev-parse HEAD)" == 4e5b548a97b2ddc72e8e7fa2211604be4a56a2b6 ]]
          [[ "$(git -C source/tden-gateway rev-parse HEAD)" == "$EXPECTED_GATEWAY" ]]
          test -z "$(git -C source/tden-chain status --porcelain=v1)"
          test -z "$(git -C source/tden-gateway status --porcelain=v1)"
      - name: Install the same exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.7
          cache-dependency-path: |
            source/tden-chain/go.sum
            source/tden-gateway/go.sum
      - name: Identify reward rejection without transaction dumps
        id: reward
        continue-on-error: true
        working-directory: source/tden-gateway
        run: go test ./internal/cosmos -run '^(TestRewardStorageConfirmationV1OriginalFirstAndFreshReservation|TestRewardStorageOriginalTxV1DurableBeforeSendAndOriginalOnlyRecovery)$' -count=1
      - name: Test isolated public-release store fixture
        id: handler
        continue-on-error: true
        working-directory: source/tden-gateway
        run: go test ./internal/handlers -run '^TestPublicReleaseRequestSecretUIDAndReplayBoundaries$' -count=1
      - name: Preserve actual diagnostic outcomes
        if: always()
        env:
          REWARD_OUTCOME: ${{ steps.reward.outcome }}
          HANDLER_OUTCOME: ${{ steps.handler.outcome }}
        run: |
          set -euo pipefail
          printf 'Reward diagnostic: %s; handler fixture: %s\n' "$REWARD_OUTCOME" "$HANDLER_OUTCOME"
          [[ "$REWARD_OUTCOME" == success && "$HANDLER_OUTCOME" == success ]]
