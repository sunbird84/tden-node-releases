name: Build TDEN node candidate

on:
  workflow_dispatch:
    inputs:
      chain_ref:
        description: Exact tden-chain commit or tag
        required: true
        type: string
      gateway_ref:
        description: Exact tden-gateway commit or tag
        required: true
        type: string
      deploy_ref:
        description: Exact tden-deploy commit or tag
        required: true
        type: string
      version:
        description: Semantic package version
        required: true
        default: 0.12.0-test.20261112.1
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: node-candidate-${{ inputs.chain_ref }}-${{ inputs.gateway_ref }}-${{ inputs.deploy_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Restrict privacy package test to reviewed inputs
        shell: bash
        env:
          CHAIN_REF: ${{ inputs.chain_ref }}
          GATEWAY_REF: ${{ inputs.gateway_ref }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          expected = {
              'GITHUB_REPOSITORY': 'sunbird84/tden-node-releases',
              'GITHUB_REPOSITORY_ID': '1335347210',
              'GITHUB_REF': 'refs/heads/codex/node-core-team-20261112',
              'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_RUN_ATTEMPT': '1',
              'CHAIN_REF': '0a13062cdfc955d4c1fd33e478ddab36095aa804',
              'GATEWAY_REF': '5e8027b3af3cf2cbd15621cee2e100100d19993a',
              'DEPLOY_REF': '6afe37b6acd835f15e02c8531f14a573da1ca8dd',
              'PACKAGE_VERSION': '0.12.0-test.20261112.1',
          }
          if any(os.environ.get(key) != value for key, value in expected.items()):
              raise SystemExit('privacy-package-input-guard: rejected input')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          parent = 'd98933b9ad439d39c3cc3343b513a94d27a08728'
          if git('rev-parse', 'HEAD') != os.environ.get('GITHUB_SHA'):
              raise SystemExit('privacy-package-input-guard: rejected control identity')
          if git('show', '-s', '--format=%P', 'HEAD') != parent:
              raise SystemExit('privacy-package-input-guard: rejected parent')
          paths = git('diff-tree', '--no-commit-id', '--name-only', '-r', parent, 'HEAD').splitlines()
          if paths != ['.github/workflows/build-node-candidate.yml']:
              raise SystemExit('privacy-package-input-guard: rejected control paths')
          print('privacy-package-input-guard: accepted reviewed inputs')
          PY

      - name: Reject expired public bootstrap fixture before build
        shell: bash
        run: python3 -B scripts/check_bootstrap_fixture_dates.py --manifest scripts/fixtures/bootstrap-preflight/bootstrap-manifest.json

      - name: Check out Chain source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-chain
          ref: ${{ inputs.chain_ref }}
          path: source/tden-chain
          ssh-key: ${{ secrets.TDEN_CHAIN_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out Gateway source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-gateway
          ref: ${{ inputs.gateway_ref }}
          path: source/tden-gateway
          ssh-key: ${{ secrets.TDEN_GATEWAY_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out deployment source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sunbird84/tden-deploy
          ref: ${{ inputs.deploy_ref }}
          path: source/deploy
          ssh-key: ${{ secrets.TDEN_DEPLOY_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: |
            source/tden-chain/go.sum
            source/tden-gateway/go.sum

      - name: Verify source revisions are exact and clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'source/tden-chain' = '${{ inputs.chain_ref }}'
            'source/tden-gateway' = '${{ inputs.gateway_ref }}'
            'source/deploy' = '${{ inputs.deploy_ref }}'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $head = (git -C $entry.Key rev-parse HEAD).Trim()
            $resolved = (git -C $entry.Key rev-parse "$($entry.Value)^{commit}").Trim()
            if ($head -cne $resolved) { throw "source revision mismatch: $($entry.Key)" }
            if (git -C $entry.Key status --porcelain=v1) { throw "dirty source checkout: $($entry.Key)" }
          }

      - name: Verify fixed release trust policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          policy = json.loads(pathlib.Path('release-policy.json').read_text(encoding='utf-8'))
          if set(policy) != {'protocol', 'bootstrap_trust_template_sha256', 'tuf_root_sha256'}:
              raise SystemExit('release policy fields are invalid')
          if policy['protocol'] != 'tden:node-release-policy:v1':
              raise SystemExit('release policy protocol is invalid')
          files = {
              'bootstrap_trust_template_sha256': pathlib.Path('source/deploy/node-installer/trust/bootstrap-trust-template.production.json'),
              'tuf_root_sha256': pathlib.Path('source/deploy/node-installer/trust/tuf-root.production.json'),
          }
          for key, path in files.items():
              value = policy.get(key, '')
              if not re.fullmatch(r'[0-9a-f]{64}', value):
                  raise SystemExit(f'{key} is invalid')
              if hashlib.sha256(path.read_bytes()).hexdigest() != value:
                  raise SystemExit(f'{path} conflicts with release-policy.json')
          PY

      - name: Materialize reviewed synthetic shared vectors from private source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/tden-spec
          test ! -L source/tden-spec
          for rel in \
            test-vectors/registration-operation-read-v1.json \
            test-vectors/authenticated-enrollment-v1.json \
            spec/testdata/token-payment-review-v1.json \
            vectors/presence-device-proof-v1.json; do
            src="source/tden-chain/testdata/shared-spec/$rel"
            dst="source/tden-spec/$rel"
            test -f "$src"
            test ! -L "$src"
            install -D -m 0644 -- "$src" "$dst"
            cmp -- "$src" "$dst"
          done

      - name: Acquire pinned Kubo from the exact official asset
        id: kubo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/prefetch_kubo.py

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          (cd source/tden-chain && go test ./...)
          (cd source/tden-gateway && go test ./...)
          go run scripts/check-public-policy-contract.go -- source/tden-gateway/internal/nodesecurity/policy.go source/deploy/node-installer/install.sh
          (cd source/tden-gateway && go test -c ./cmd/gateway -o /tmp/tden-gateway-receipts.test)
          sudo env TDEN_TEST_RECEIPT_PERMISSIONS=1 /tmp/tden-gateway-receipts.test -test.run '^TestReleaseReceipt' -test.v
          (cd source/tden-gateway && go test -c ./cmd/node-service-config -o /tmp/tden-node-service-config.test)
          sudo /tmp/tden-node-service-config.test -test.run '^(TestReconcilePlanConsumesExactAuthorizationOnce|TestHandoffPermissionRetryDoesNotAdvanceGeneration)$' -test.v
          (cd source/tden-gateway && go test -c ./cmd/node-public-handoff -o /tmp/tden-node-public-handoff.test)
          sudo /tmp/tden-node-public-handoff.test -test.run '^TestServiceMigrationHelperRequiresExactImmutablePolicyBinding$' -test.v
          for script in source/deploy/node-installer/*.sh; do
            bash -n "$script"
          done
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 source/deploy/node-installer/test-gateway-release-catalog.py
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 -B source/deploy/node-installer/test-release-receipt-permissions.py -v
          sudo bash source/deploy/node-installer/test-public-supervisor-storage-access.sh
          python3 source/deploy/node-installer/test-public-endpoint.py AddressTests -v
          python3 -B source/deploy/node-installer/test-resolve-public-ca-route.py -v
          python3 -B source/deploy/node-installer/test-public-supervisor-preflight.py -v
          python3 -B source/deploy/node-installer/test-node-runtime-files.py -v
          python3 -B source/deploy/node-installer/test-install-quiescence.py -v
          node --test source/deploy/node-installer/test-pristine-genesis-upgrade.test.mjs
          node --test source/deploy/node-installer/test-ipfs-role-mode.test.mjs
          python3 -B source/deploy/node-installer/test-archive-node-package.py -v
          sudo env TDEN_TEST_SYSTEMD_SANDBOX=1 python3 -B source/deploy/node-installer/test-node-runtime-files.py RuntimeScanSystemdTests -v
          sudo python3 source/deploy/node-installer/test-caddy-handoff.py -v
          sudo python3 source/deploy/node-installer/test-lifecycle-history.py -v
          pwsh -NoProfile -File source/deploy/node-installer/test-install-state-root.ps1
          pwsh -NoProfile -File source/deploy/node-installer/test-release-isolation.ps1
          pwsh -NoProfile -File source/deploy/node-installer/test-node-runtime-upgrade-contract.ps1

      - name: Build deterministic Linux package
        shell: pwsh
        env:
          TDEN_KUBO_ARCHIVE: ${{ steps.kubo.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path output/package -Force | Out-Null
          & source/deploy/node-installer/build-node-package.ps1 `
            -OutputDirectory output/package `
            -BootstrapTrustTemplate source/deploy/node-installer/trust/bootstrap-trust-template.production.json `
            -TufRoot source/deploy/node-installer/trust/tuf-root.production.json `
            -ReleaseTrustTemplate source/deploy/node-installer/trust/release-trust-template.production.json `
            -ApprovalAttestationAllowlist source/deploy/node-installer/trust/approval-attestations.fail-closed.txt `
            -LifecycleGatewayTrust source/deploy/node-installer/trust/lifecycle-gateway-trust.production.json `
            -KuboArchive $env:TDEN_KUBO_ARCHIVE `
            -Profile public `
            -Architecture amd64 `
            -Version '${{ inputs.version }}'

      - name: Archive and describe candidate
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output/release
          SOURCE_DATE_EPOCH=0 bash source/deploy/node-installer/archive-node-package.sh \
            output/package output/release/tden-node-linux-amd64.tar.gz
          (cd output/release && sha256sum tden-node-linux-amd64.tar.gz > tden-node-linux-amd64.tar.gz.sha256)
          python3 scripts/candidate_metadata.py create

      - name: Verify archived bootstrap and original metadata
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/package_bootstrap_preflight.py \
            --archive output/release/tden-node-linux-amd64.tar.gz \
            --version "$CANDIDATE_VERSION" \
            --materials scripts/fixtures/bootstrap-preflight

      - name: Upload candidate without publishing a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tden-node-candidate-${{ github.run_id }}
          path: output/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attest candidate archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release/tden-node-linux-amd64.tar.gz

      - name: Attest candidate build description
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release/candidate-build.json
